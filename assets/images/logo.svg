      L 325 769
      Q 313 776 302 770
      Q 284 760 284 739
      V 220
      A 24 24 0 0 1 308 196
      Z
    " stroke="#111111" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" fill="none" />

    <!-- Folded page corner -->
