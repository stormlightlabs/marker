<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-labelledby="title desc">
    <title id="title">Marker bookmark highlight icon</title>
    <desc id="desc">
        A document-shaped bookmark icon with a folded corner, yellow highlight stroke,
        and black underline.
    </desc>

    <!-- <rect width="1024" height="1024" fill="white" /> -->

    <!-- Document / bookmark outline -->
