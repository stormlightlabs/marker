name: marker
description: "A new Flutter project."
publish_to: "none"

# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.32.1
  flutter_riverpod: ^3.3.1
  fuzzywuzzy: ^1.2.0
  flutter_inappwebview: ^6.1.5
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.2
  flutter_markdown_plus: ^1.0.7
  code_forge: ^9.9.0
  re_highlight: ^0.0.3
  share_plus: ^13.1.0
  logger: ^2.6.2
  bluesky_poptart: ^0.1.1
  poptart: ^0.1.1
  poptart_core: ^0.1.1
  poptart_oauth: ^0.1.1
  poptart_lex: ^0.1.0
  margin_poptart: ^0.1.0
  flutter_secure_storage: ^10.3.0
  flutter_web_auth_2: ^5.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  cosmik_poptart: ^0.1.0
  flutter_svg: ^2.3.0
  rough_notation: ^0.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.32.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_lint: ^3.1.4-dev.1

dependency_overrides:
  meta: ^1.18.0
  test_api: ^0.7.12
  matcher: ^0.12.16+1
  code_forge:
    path: vendor/code_forge

flutter:
  # for material fonts
  uses-material-design: true
  assets:
    - assets/js/reader.js
    - assets/filters/
    - assets/fonts/
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/icon.png
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#ffffff"
  image: assets/images/splash.png
  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: assets/images/splash.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#ffffff"
