  uuid: ^4.5.2
  flutter_markdown_plus: ^1.0.7
  code_forge: ^9.9.0
  re_highlight: ^0.0.3
  share_plus: ^13.1.0
  logger: ^2.6.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.32.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # for material fonts
  uses-material-design: true
  assets:
    - assets/js/reader.js
    - assets/filters/
